<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Language Settings — Rent Nivas</title>
  <link rel="icon" href="./favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Noto+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --terra: #c96a3b;
      --terra-light: #e88a5a;
      --bg: #0f1117;
      --surface: #181c27;
      --surface2: #1e2333;
      --border: rgba(255,255,255,0.07);
      --text: #f0f0f4;
      --soft: rgba(240,240,244,0.55);
      --softer: rgba(240,240,244,0.28);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sora', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ─── TOP BAR ─── */
    .lang-topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .lang-topbar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-decoration: none;
    }

    .lang-topbar-logo img {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      object-fit: cover;
    }

    .lang-topbar-logo span {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }

    .lang-topbar-title {
      flex: 1;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      color: var(--soft);
      letter-spacing: 0.02em;
    }

    .lang-back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--soft);
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 14px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .lang-back-btn:hover {
      color: var(--text);
      border-color: var(--terra);
      background: rgba(201,106,59,0.07);
    }

    /* ─── MAIN ─── */
    .lang-main {
      flex: 1;
      max-width: 700px;
      width: 100%;
      margin: 0 auto;
      padding: 48px 24px 64px;
    }

    .lang-hero {
      text-align: center;
      margin-bottom: 48px;
    }

    .lang-hero-icon {
      font-size: 52px;
      margin-bottom: 16px;
      display: block;
      filter: drop-shadow(0 0 24px rgba(201,106,59,0.4));
      animation: floatIcon 3s ease-in-out infinite;
    }

    @keyframes floatIcon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .lang-hero h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
    }

    .lang-hero p {
      font-size: 14px;
      color: var(--soft);
      line-height: 1.7;
    }

    /* ─── CURRENT LANGUAGE BADGE ─── */
    .current-lang-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, rgba(201,106,59,0.15), rgba(201,106,59,0.05));
      border: 1px solid rgba(201,106,59,0.3);
      border-radius: 14px;
      padding: 14px 20px;
      margin-bottom: 32px;
    }

    .current-lang-badge .badge-label {
      font-size: 12px;
      color: var(--soft);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .current-lang-badge .badge-lang {
      font-size: 17px;
      font-weight: 600;
      color: var(--terra-light);
      flex: 1;
    }

    .current-lang-badge .badge-flag {
      font-size: 26px;
    }

    /* ─── SEARCH ─── */
    .lang-search-wrap {
      position: relative;
      margin-bottom: 24px;
    }

    .lang-search-wrap input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px 12px 42px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .lang-search-wrap input:focus {
      border-color: rgba(201,106,59,0.5);
    }

    .lang-search-wrap input::placeholder {
      color: var(--softer);
    }

    .lang-search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 15px;
      color: var(--softer);
      pointer-events: none;
    }

    /* ─── LANGUAGE GRID ─── */
    .lang-section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--softer);
      margin-bottom: 12px;
    }

    .lang-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
      margin-bottom: 32px;
    }

    .lang-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }

    .lang-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(201,106,59,0.08), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .lang-card:hover {
      border-color: rgba(201,106,59,0.4);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }

    .lang-card:hover::before {
      opacity: 1;
    }

    .lang-card.selected {
      border-color: var(--terra);
      background: linear-gradient(135deg, rgba(201,106,59,0.18), rgba(201,106,59,0.06));
    }

    .lang-card.selected::before {
      opacity: 1;
    }

    .lang-card-flag {
      font-size: 28px;
      flex-shrink: 0;
      line-height: 1;
    }

    .lang-card-info {
      flex: 1;
      min-width: 0;
    }

    .lang-card-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lang-card-native {
      font-size: 12px;
      color: var(--soft);
      margin-top: 2px;
    }

    .lang-card-check {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: transparent;
      transition: all 0.2s;
    }

    .lang-card.selected .lang-card-check {
      background: var(--terra);
      border-color: var(--terra);
      color: white;
    }

    /* ─── APPLY BUTTON ─── */
    .lang-apply-wrap {
      position: sticky;
      bottom: 0;
      padding: 16px 0 8px;
      background: linear-gradient(to top, var(--bg) 80%, transparent);
      margin-top: 8px;
    }

    .lang-apply-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--terra), var(--terra-light));
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(201,106,59,0.35);
    }

    .lang-apply-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(201,106,59,0.45);
    }

    .lang-apply-btn:active {
      transform: translateY(0);
    }

    /* ─── TOAST ─── */
    .lang-toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface2);
      border: 1px solid rgba(201,106,59,0.4);
      border-radius: 12px;
      padding: 12px 22px;
      font-size: 14px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 1000;
      white-space: nowrap;
    }

    .lang-toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* ─── NO RESULTS ─── */
    .lang-no-results {
      text-align: center;
      padding: 40px 20px;
      color: var(--soft);
      display: none;
    }

    .lang-no-results.visible {
      display: block;
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 500px) {
      .lang-main { padding: 32px 16px 80px; }
      .lang-hero h1 { font-size: 22px; }
      .lang-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
      .lang-topbar { padding: 12px 16px; }
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <header class="lang-topbar">
    <a class="lang-topbar-logo" href="./index.html">
      <img src="./favicon.png" alt="Rent Nivas" />
      <span>Rent Nivas</span>
    </a>
    <span class="lang-topbar-title">Language Settings</span>
    <button class="lang-back-btn" onclick="goBack()">← Back</button>
  </header>

  <!-- MAIN CONTENT -->
  <main class="lang-main">

    <div class="lang-hero">
      <span class="lang-hero-icon">🌐</span>
      <h1>Choose Your Language</h1>
      <p>Select your preferred language for the Rent Nivas experience.<br/>Your choice is saved automatically and applies across all pages.</p>
    </div>

    <!-- CURRENT SELECTION -->
    <div class="current-lang-badge" id="current-badge">
      <div>
        <div class="badge-label">Currently Active</div>
        <div class="badge-lang" id="current-badge-name">English</div>
      </div>
      <span class="badge-flag" id="current-badge-flag">🇬🇧</span>
    </div>

    <!-- SEARCH -->
    <div class="lang-search-wrap">
      <span class="lang-search-icon">🔍</span>
      <input type="text" id="lang-search" placeholder="Search language…" oninput="filterLanguages()" autocomplete="off" />
    </div>

    <!-- LANGUAGE GRID -->
    <div class="lang-section-label" id="section-label">All Languages</div>
    <div class="lang-grid" id="lang-grid"></div>
    <div class="lang-no-results" id="no-results">😔 No languages found. Try a different search.</div>

    <!-- APPLY BUTTON -->
    <div class="lang-apply-wrap">
      <button class="lang-apply-btn" id="apply-btn" onclick="applyLanguage()">
        Apply Language
      </button>
    </div>

  </main>

  <!-- TOAST -->
  <div class="lang-toast" id="lang-toast">
    <span>✅</span> <span id="toast-msg">Language saved!</span>
  </div>

  <script>
    const LANGUAGES = [
      { code: 'en', name: 'English', native: 'English', flag: '🇬🇧' },
      { code: 'hi', name: 'Hindi', native: 'हिन्दी', flag: '🇮🇳' },
      { code: 'te', name: 'Telugu', native: 'తెలుగు', flag: '🇮🇳' },
      { code: 'ta', name: 'Tamil', native: 'தமிழ்', flag: '🇮🇳' },
      { code: 'mr', name: 'Marathi', native: 'मराठी', flag: '🇮🇳' },
      { code: 'bn', name: 'Bengali', native: 'বাংলা', flag: '🇮🇳' },
      { code: 'gu', name: 'Gujarati', native: 'ગુજરાતી', flag: '🇮🇳' },
      { code: 'kn', name: 'Kannada', native: 'ಕನ್ನಡ', flag: '🇮🇳' },
      { code: 'ml', name: 'Malayalam', native: 'മലയാളം', flag: '🇮🇳' },
      { code: 'pa', name: 'Punjabi', native: 'ਪੰਜਾਬੀ', flag: '🇮🇳' },
    ];

    const STORAGE_KEY = 'rn_language';
    let selectedCode = localStorage.getItem(STORAGE_KEY) || 'en';
    if (!LANGUAGES.some(l => l.code === selectedCode)) selectedCode = 'en';
    let pendingCode = selectedCode;

    function getLang(code) {
      return LANGUAGES.find(l => l.code === code) || LANGUAGES[0];
    }

    function renderGrid(filter = '') {
      const grid = document.getElementById('lang-grid');
      const noRes = document.getElementById('no-results');
      const label = document.getElementById('section-label');
      const q = filter.toLowerCase().trim();

      const filtered = q
        ? LANGUAGES.filter(l => l.name.toLowerCase().includes(q) || l.native.toLowerCase().includes(q))
        : LANGUAGES;

      label.textContent = q ? `Results for "${filter}"` : 'All Languages';

      if (filtered.length === 0) {
        grid.innerHTML = '';
        noRes.classList.add('visible');
        return;
      }
      noRes.classList.remove('visible');

      grid.innerHTML = filtered.map(lang => `
        <div class="lang-card ${lang.code === pendingCode ? 'selected' : ''}"
             id="card-${lang.code}"
             onclick="selectLang('${lang.code}')">
          <span class="lang-card-flag">${lang.flag}</span>
          <div class="lang-card-info">
            <div class="lang-card-name">${lang.name}</div>
            <div class="lang-card-native">${lang.native}</div>
          </div>
          <span class="lang-card-check">✓</span>
        </div>
      `).join('');
    }

    function selectLang(code) {
      pendingCode = code;
      renderGrid(document.getElementById('lang-search').value);
      const lang = getLang(code);
      document.getElementById('apply-btn').textContent = `Apply — ${lang.name} ${lang.flag}`;
    }

    function filterLanguages() {
      const q = document.getElementById('lang-search').value;
      renderGrid(q);
    }

    function updateBadge(code) {
      const lang = getLang(code);
      document.getElementById('current-badge-name').textContent = lang.name + ' — ' + lang.native;
      document.getElementById('current-badge-flag').textContent = lang.flag;
    }

    function applyLanguage() {
      selectedCode = pendingCode;
      localStorage.setItem(STORAGE_KEY, selectedCode);
      try { if (window.opener && window.opener.RNi18n) window.opener.RNi18n.apply(selectedCode); } catch (e) {}
      updateBadge(selectedCode);
      const lang = getLang(selectedCode);
      showToast(`${lang.flag}  "${lang.name}" is now your language`);
      document.getElementById('apply-btn').textContent = `Apply Language`;
      // Redirect back to the site after a short delay so the toast is visible
      setTimeout(() => {
        if (window.opener) {
          // Opened as a new tab by window.open() — close this tab, parent stays open
          window.close();
        } else if (history.length > 1) {
          history.back();
        } else {
          location.href = './index.html';
        }
      }, 1200);
    }

    function showToast(msg) {
      const t = document.getElementById('lang-toast');
      document.getElementById('toast-msg').textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function goBack() {
      if (window.opener) {
        window.close();
      } else if (history.length > 1) {
        history.back();
      } else {
        location.href = './index.html';
      }
    }

    // ── INIT ──
    updateBadge(selectedCode);
    renderGrid();
  </script>

</html>
